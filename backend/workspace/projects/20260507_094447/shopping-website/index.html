<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - 优质购物体验</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-left">
                <a href="#" class="logo">ShopEasy</a>
                <div class="search-bar">
                    <input type="text" placeholder="搜索商品..." id="searchInput">
                    <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div class="nav-right">
                <a href="#" onclick="showCategory('all')"><i class="fas fa-home"></i> 首页</a>
                <a href="#" onclick="showCategory('electronics')"><i class="fas fa-laptop"></i> 电子产品</a>
                <a href="#" onclick="showCategory('clothing')"><i class="fas fa-tshirt"></i> 服装</a>
                <a href="#" onclick="showCategory('home')"><i class="fas fa-home"></i> 家居</a>
                <a href="#" onclick="showCategory('beauty')"><i class="fas fa-spa"></i> 美妆</a>
                <div class="cart-icon" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <button class="btn-login">登录</button>
            </div>
        </div>
    </nav>

    <!-- 横幅 -->
    <section class="hero">
        <div class="hero-content">
            <h1>品质生活，从这里开始</h1>
            <p>精选全球好物，享受便捷购物体验</p>
            <button class="btn-primary" onclick="showCategory('all')">开始购物</button>
        </div>
    </section>

    <!-- 分类导航 -->
    <section class="categories">
        <div class="container">
            <h2>热门分类</h2>
            <div class="category-grid">
                <div class="category-card" onclick="showCategory('electronics')">
                    <i class="fas fa-laptop fa-3x"></i>
                    <h3>电子产品</h3>
                </div>
                <div class="category-card" onclick="showCategory('clothing')">
                    <i class="fas fa-tshirt fa-3x"></i>
                    <h3>服装鞋帽</h3>
                </div>
                <div class="category-card" onclick="showCategory('home')">
                    <i class="fas fa-couch fa-3x"></i>
                    <h3>家居用品</h3>
                </div>
                <div class="category-card" onclick="showCategory('beauty')">
                    <i class="fas fa-spa fa-3x"></i>
                    <h3>美妆护肤</h3>
                </div>
            </div>
        </div>
    </section>

    <!-- 产品展示 -->
    <section class="products" id="productsSection">
        <div class="container">
            <div class="section-header">
                <h2 id="productsTitle">所有商品</h2>
                <div class="sort-options">
                    <select id="sortSelect" onchange="sortProducts()">
                        <option value="default">默认排序</option>
                        <option value="price-asc">价格从低到高</option>
                        <option value="price-desc">价格从高到低</option>
                        <option value="rating">评分从高到低</option>
                    </select>
                </div>
            </div>
            <div class="product-grid" id="productGrid">
                <!-- 产品卡片将通过JavaScript动态生成 -->
            </div>
        </div>
    </section>

    <!-- 购物车 -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()">
        <div class="cart-container" onclick="event.stopPropagation()">
            <div class="cart-header">
                <h3>购物车 <span id="cartItemCount">0</span> 件</h3>
                <button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button>
            </div>
            <div class="cart-items" id="cartItems">
                <p class="empty-cart">购物车为空</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>总计：</span>
                    <strong id="cartTotal">¥0.00</strong>
                </div>
                <button class="btn-checkout" onclick="checkout()">去结算</button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h4>ShopEasy</h4>
                    <p>品质生活，从这里开始。我们致力于为您提供优质的购物体验。</p>
                </div>
                <div class="footer-col">
                    <h4>快速链接</h4>
                    <a href="#">首页</a>
                    <a href="#">产品</a>
                    <a href="#">关于我们</a>
                    <a href="#">联系我们</a>
                </div>
                <div class="footer-col">
                    <h4>帮助中心</h4>
                    <a href="#">常见问题</a>
                    <a href="#">退换货政策</a>
                    <a href="#">配送信息</a>
                    <a href="#">隐私政策</a>
                </div>
                <div class="footer-col">
                    <h4>联系我们</h4>
                    <p><i class="fas fa-phone"></i> 400-123-4567</p>
                    <p><i class="fas fa-envelope"></i> service@shopeasy.com</p>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-weixin"></i></a>
                        <a href="#"><i class="fab fa-weibo"></i></a>
                        <a href="#"><i class="fab fa-qq"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 ShopEasy. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
